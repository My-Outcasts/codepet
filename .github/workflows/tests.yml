name: Tests

# The gap this closes: before it, `.github/workflows/` held only pages.yml, so no PR in
# this repo had anything to pass. `main` shipped a red test twice without anyone noticing
# — once for three days — and every "N/N green" in a PR description was somebody's local
# machine and their word for it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One run per branch. A force-push (this repo rebases rather than merges when main moves)
# should cancel the run for the commit it replaced instead of paying for both.
#
# But NOT on `main`. This was an unconditional `true`, and on Aug 11 it cancelled #95's own
# verification run when #93 merged moments later — so that commit on `main` was never checked.
# Nothing was broken (the next run covered the same change), but it makes "every push to main
# runs the suite" false exactly when the day is busiest, which is when a break is most likely
# and hardest to attribute. A PR's superseded run is worth cancelling because its commit no
# longer exists; a `main` commit is permanent and stays in the history whether it was checked
# or not.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Cloud Functions half of the product. Added Aug 11, a day after the Swift job, because
  # PR #89 changed `companyChat` and `runTask` — the two functions a founder's every chat turn
  # and every task run go through — and its 502 tests were run on one laptop and reported in
  # the PR body. That is the same "somebody's word for it" this workflow exists to end; the
  # Swift job just happened to be written first.
  #
  # Its own job rather than steps on the macOS one: this needs Node, not Xcode, and an ubuntu
  # runner bills at 1x against macOS's 10x. It also means a Swift failure and a functions
  # failure are separately legible instead of one red X covering both.
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions

    steps:
      - uses: actions/checkout@v4

      - name: Packaging guard tests
        # `scripts/verify-sidecars-bundled.sh` is what stops a Codepet.app with no local
        # runner reaching the public .dmg. It is pure bash over directories named `*.app`,
        # so it needs neither Xcode nor a signing identity and rides the 1x ubuntu job
        # rather than the 10x macOS one.
        #
        # It is tested here rather than only run at release time because release time is
        # once a version and by hand — a guard that is only exercised when someone
        # remembers to cut a build is a guard nobody notices has stopped working.
        working-directory: .
        run: |
          ./scripts/test-verify-sidecars.sh
          ./scripts/test-preflight-release.sh

      - uses: actions/setup-node@v4
        with:
          # Matches `engines.node` in functions/package.json, which matches the deployed
          # runtime (nodejs22). A CI runtime that drifts from production tests the wrong thing.
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install
        # `ci`, not `install`: it installs exactly the lockfile and fails if package.json and
        # the lock disagree, which is a real signal rather than something to auto-resolve.
        run: npm ci

      - name: Typecheck
        # Worth its own step. Deploys compile TS, so a type error here is a BROKEN DEPLOY
        # waiting to happen — and it is invisible to Jest, which runs through ts-jest with
        # its own leniency. This is exactly how the dept_key work first failed locally: tests
        # green, `tsc` red, because the request-body interfaces had not learned the new field.
        run: npx tsc --noEmit

      - name: Bundle the sidecars
        # **The check nothing else performs.** `functions/src` holds two kinds of code that look
        # identical in a listing: hosted handlers, and the builders esbuild inlines into the
        # macOS app. The bundles are gitignored and Jest never builds them — so deleting a
        # bundled file leaves this whole job green and breaks the app on a founder's machine.
        #
        # That is not hypothetical. The claude-code-only branch came within one step of deleting
        # `company/`, whose `orchestrate.ts` and `router.ts` are inlined into `vcSidecar`. It was
        # caught by hand. A meeting that will not start is not a failure CI should leave to
        # whoever happens to re-read the import graph.
        #
        # Bundling only — the flags mirror `scripts/build-sidecar.sh`. It does not run the
        # bundles, because the runtime checks there need the `claude` CLI, which no runner has.
        # Compiling the closure is what catches a deleted dependency.
        #
        # `|| exit 1` rather than relying on `set -e`: a failing command inside a `for` loop is
        # exactly where shells disagree about ERR_EXIT, and this guard was written with the loop
        # silently completing on a bundle that had already failed. A guard whose behaviour
        # depends on which shell runs it is not a guard.
        run: |
          for entry in chatSidecar oneShotSidecar vcSidecar; do
            echo "▸ bundling $entry"
            npx esbuild "src/local/$entry.ts" \
              --bundle --platform=node --target=node20 --format=cjs \
              --outfile="/tmp/$entry.js" || exit 1
          done

      - name: Test
        # 34 suites / 502 tests as of a134421. JEST here, not vitest — the web app used vitest
        # and confusing the two has cost time before.
        run: npm test -- --ci

  test:
    # macOS runners bill at 10x Linux minutes, so this is deliberately ONE job that runs
    # the whole suite rather than a matrix. It is also why there is no scheduled trigger:
    # tests run when code changes, not on a timer.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        # Not pinned to an exact version: the deployment target is macOS 26.2, so the
        # runner image must be new enough regardless, and pinning to a version the image
        # later drops turns every PR red for a reason unrelated to the PR.
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Cache SwiftPM dependencies
        # 16 resolved packages, Firebase among them — resolution is minutes on a cold
        # runner. Keyed on Package.resolved so a dependency bump busts the cache.
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('CodePet.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Bundle the sidecars into the app's resources
        # **Without this the app under test is missing its own resources**, and the tests that
        # notice do not say so. The bundles are gitignored build artifacts, so a checkout has
        # none: `LocalOneShotRunner.isAvailable()` reads false, `LocalTransportRouter.transport`
        # returns `.blocked(.sidecarMissing)`, and every test that reaches the real one-shot
        # path silently takes the blocked branch. It passed on developers' machines, where the
        # files are simply lying around from the last `build-sidecar.sh`.
        #
        # That is not hypothetical either: it is how the provenance-stamp tests went green
        # locally and red here, reporting a nil `producedBy` rather than a missing file. The
        # four tests now inject their own availability, but the gap was never only theirs —
        # any future test through that path would inherit it.
        #
        # `scripts/build-sidecar.sh` is deliberately NOT reused: it also EXECUTES each bundle
        # to verify both modes are reachable, and those runtime checks want the `claude` CLI,
        # which no runner has. The flags below mirror its bundling half, and the `--outfile`
        # paths are where `Bundle.main` looks (`codepet/Resources/`), not the /tmp the
        # functions job uses — that job is on a different runner and proves only that the
        # import graph still compiles.
        # The `(cd functions && …)` subshell is how `build-sidecar.sh` invokes esbuild, and it
        # is not decoration: the bundler resolves `src/local/…` and every transitive import
        # against the directory it runs in, and `functions/` is where the dependencies live.
        run: |
          set -euo pipefail
          (cd functions && npm ci)
          for entry in chatSidecar oneShotSidecar vcSidecar; do
            echo "▸ bundling $entry"
            (cd functions && npx esbuild "src/local/$entry.ts" \
              --bundle --platform=node --target=node20 --format=cjs \
              --outfile="../codepet/Resources/$entry.js") || exit 1
          done
          ls -l codepet/Resources/*.js

      - name: Run tests
        run: ./scripts/ci-test.sh

      - name: Upload the result bundle
        # Only on failure, and only the bundle — it is the thing that answers "which test,
        # and what did it actually say", which the log alone does not.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/ci.xcresult
          retention-days: 7
